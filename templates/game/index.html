<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{{TITLE}}</title>
  <meta name="description" content="{{DESCRIPTION}}">
  <link rel="canonical" href="{{SITE_URL}}/games/{{SLUG}}/">
  <meta property="og:type" content="website">
  <meta property="og:title" content="{{TITLE}}">
  <meta property="og:description" content="{{DESCRIPTION}}">
  <meta property="og:url" content="{{SITE_URL}}/games/{{SLUG}}/">
  <meta property="og:image" content="{{SITE_URL}}/games/{{SLUG}}/og.png">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="game" class="game">
    <h1>{{TITLE}}</h1>
    <p class="hint">{{DESCRIPTION}}</p>
    <!-- ここにゲーム本体を作る。テンプレートの中身は置き換えてよい。 -->
    <button id="play" type="button">タップ</button>
    <p>スコア: <output id="score">0</output></p>
  </main>
  <footer class="arcade-link"><a href="/">Game Arcade</a></footer>
  <script type="module" src="game.js"></script>
</body>
</html>
