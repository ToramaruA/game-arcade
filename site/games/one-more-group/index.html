<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>あと1人、乗れます</title>
  <meta name="description" content="定員10人、運べるのは5便。先頭3組からお客さんを選んで、できるだけ満員で出発しよう！">
  <link rel="canonical" href="https://game-arcade-bdt.pages.dev/games/one-more-group/">
  <meta property="og:type" content="website">
  <meta property="og:title" content="あと1人、乗れます">
  <meta property="og:description" content="定員10人、運べるのは5便。先頭3組からお客さんを選んで、できるだけ満員で出発しよう！">
  <meta property="og:url" content="https://game-arcade-bdt.pages.dev/games/one-more-group/">
  <meta property="og:image" content="https://game-arcade-bdt.pages.dev/games/one-more-group/og.png">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="game" class="game">
    <h1>あと1人、乗れます</h1>
    <p class="status">
      <span>第<b id="trip">1</b>便 / 5</span>
      <span>輸送済み <b id="delivered">0</b>人</span>
      <span>待ち <b id="waiting">18</b>組</span>
      <span>ベスト <b id="best">-</b></span>
    </p>
    <section class="lift" aria-label="エレベーター">
      <div id="car" class="car">
        <div id="slots" class="slots" aria-hidden="true"></div>
      </div>
      <p class="load"><b id="load">0</b> / 10人　<span id="left">あと10人</span></p>
    </section>
    <p id="msg" class="msg" role="status">乗せたい組を選ぼう</p>
    <div id="groups" class="groups"></div>
    <button id="go" type="button" class="go">出発</button>
    <section id="result" class="result" hidden>
      <p class="big"><b id="final">0</b> 人を運びました（最大50人）</p>
      <p id="newbest" class="newbest" hidden>自己ベスト更新！</p>
      <p class="luck">並びによって運が違います。同じ並びで挑戦し直すか、新しい並びを試せます。</p>
      <div class="row">
        <button id="again" type="button">同じ並びでもう一度</button>
        <button id="fresh" type="button" class="alt">新しい並び</button>
      </div>
    </section>
  </main>
  <footer class="arcade-link"><a href="/">Game Arcade</a></footer>
  <script type="module" src="game.js"></script>
</body>
</html>
