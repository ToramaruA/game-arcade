<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>霧鯨と糸の勇者</title>
  <meta name="description" content="走れ、跳べ、光の糸を投げろ。窓から覗く悪夢をかわし、夢の家で鐘を鳴らして、霧鯨のもとへ逃げる少女の横スクロールアクション。">
  <link rel="canonical" href="https://game-arcade-bdt.pages.dev/games/mist-whale-thread-hero/">
  <meta property="og:type" content="website">
  <meta property="og:title" content="霧鯨と糸の勇者">
  <meta property="og:description" content="走れ、跳べ、光の糸を投げろ。窓から覗く悪夢をかわし、夢の家で鐘を鳴らして、霧鯨のもとへ逃げる少女の横スクロールアクション。">
  <meta property="og:url" content="https://game-arcade-bdt.pages.dev/games/mist-whale-thread-hero/">
  <meta property="og:image" content="https://game-arcade-bdt.pages.dev/games/mist-whale-thread-hero/og.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#1c0d3d">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="game" class="game">
    <h1 class="sr">霧鯨と糸の勇者</h1>
    <section class="stage" id="stage">
      <canvas id="cv" aria-label="ゲーム画面。左右で走り、ジャンプと糸で進む"></canvas>

      <div class="hud" id="hud" hidden>
        <div class="hud-l">
          <div class="hearts" id="hearts" aria-label="ハート"></div>
          <div class="spool" id="spool" title="糸（Jキー）"><span class="spool-ring" id="spoolRing"></span><span class="spool-label" id="spoolLabel">糸</span></div>
        </div>
        <div class="hud-r">
          <div class="chip stage-name" id="stageName">第一章 1 廊下の扉</div>
          <div class="chip stars" id="starCount"><i class="bell-ico" aria-hidden="true"></i><b>0/3</b></div>
          <button id="menuBtn" class="chip btn icon" type="button" aria-label="一時停止とメニュー">❚❚</button>
        </div>
      </div>
      <div id="hint" class="hint" role="status" aria-live="polite"></div>
      <div id="mono" class="mono" aria-live="polite"></div>
      <div id="sfxText" class="sfx-text" aria-hidden="true"></div>
      <div id="toast" class="toast" role="status"></div>

      <div id="title" class="screen title-screen">
        <div class="logo" aria-hidden="true"><span class="logo-a">霧鯨と</span><span class="logo-b"><span class="ito">糸</span>の勇者</span><span class="tagline">こわくても、糸をたぐって。</span></div>
        <div class="title-actions">
          <button id="startBtn" class="big-btn" type="button">はじめる</button>
          <button id="titleNoteBtn" class="ghost-btn" type="button">星座ノート</button>
        </div>
        <div class="how-icons" aria-label="操作：移動、ジャンプ、糸">
          <span><kbd>←</kbd><kbd>→</kbd>移動</span><span><kbd>Space</kbd>ジャンプ</span><span><kbd>J</kbd>糸</span>
        </div>
      </div>

      <div id="map" class="screen map-screen" hidden>
        <div class="map-head">
          <button id="mapBack" class="chip btn" type="button">← タイトル</button>
          <div class="chip total" id="mapTotal"><i class="bell-ico" aria-hidden="true"></i><b>0/45</b></div>
          <button id="mapNoteBtn" class="chip btn" type="button">星座ノート</button>
        </div>
        <div class="chapters" id="chapters"></div>
      </div>
    </section>

    <section class="pad" id="pad" aria-label="操作ボタン">
      <button type="button" class="pk pk-l" data-k="left" aria-label="左へ">◀</button>
      <button type="button" class="pk pk-r" data-k="right" aria-label="右へ">▶</button>
      <button type="button" class="pk pk-j" data-k="jump" aria-label="ジャンプ"><span>ジャンプ</span></button>
      <button type="button" class="pk pk-t" data-k="thread" aria-label="糸を投げる"><span>糸</span></button>
    </section>

    <section id="pause" class="modal" hidden role="dialog" aria-modal="true" aria-label="一時停止">
      <div class="sheet small">
        <h2>ひと休み</h2>
        <p class="muted" id="pauseInfo"></p>
        <div class="col-btns">
          <button id="resumeBtn" class="big-btn" type="button">つづける</button>
          <button id="retryBtn" class="ghost-btn" type="button">この面を最初から</button>
          <button id="pauseNoteBtn" class="ghost-btn" type="button">星座ノート（遊び方・設定）</button>
          <button id="toMapBtn" class="ghost-btn" type="button">地図へもどる</button>
        </div>
      </div>
    </section>

    <section id="result" class="modal" hidden role="dialog" aria-modal="true" aria-label="クリア結果">
      <div class="sheet small result">
        <p class="eyebrow" id="resStage"></p>
        <h2>灯台に灯がともった</h2>
        <div class="res-bells" id="resBells"></div>
        <div class="res-grid">
          <div><small>タイム</small><b id="resTime"></b><span id="resPar" class="muted"></span></div>
          <div><small>被弾</small><b id="resHits"></b></div>
        </div>
        <div class="badges" id="resBadges"></div>
        <p class="unlock" id="resUnlock" hidden></p>
        <div class="col-btns">
          <button id="nextBtn" class="big-btn" type="button">次の面へ</button>
          <div class="row-btns"><button id="againBtn" class="ghost-btn" type="button">もう一度</button><button id="resMapBtn" class="ghost-btn" type="button">地図</button></div>
        </div>
      </div>
    </section>

    <section id="story" class="modal story" hidden role="dialog" aria-modal="true" aria-label="物語">
      <div class="sheet small story-sheet">
        <p class="eyebrow" id="storyHead"></p>
        <div id="storyLines" class="story-lines"></div>
        <p id="storySecret" class="secret" hidden></p>
        <button id="storyBtn" class="big-btn" type="button">つづける</button>
      </div>
    </section>

    <section id="ending" class="modal story" hidden role="dialog" aria-modal="true" aria-label="結末">
      <div class="sheet small story-sheet">
        <p class="eyebrow">目覚め</p>
        <canvas id="endScene" class="end-scene px" width="160" height="96" aria-label="目を覚ましたミオの部屋"></canvas>
        <h2 id="endTitle"></h2>
        <p id="endText" class="end-text"></p>
        <p id="endStats" class="muted"></p>
        <button id="endBtn" class="big-btn" type="button">地図へ</button>
      </div>
    </section>

    <section id="cw" class="modal story" hidden role="dialog" aria-modal="true" aria-label="はじめる前に">
      <div class="sheet small story-sheet">
        <p class="eyebrow">はじめる前に</p>
        <p class="end-text">この物語には、家庭でのつらい出来事（こわい大人、物音、あざ など）を思わせる表現があります。直接の描写はありません。</p>
        <button id="cwBtn" class="big-btn" type="button">わかった</button>
      </div>
    </section>

    <section id="note" class="modal" hidden role="dialog" aria-modal="true" aria-label="星座ノート">
      <div class="sheet note">
        <div class="sheet-head"><h2>星座ノート</h2><button id="noteClose" class="chip btn" type="button">とじる</button></div>
        <nav class="note-tabs" id="noteTabs">
          <button type="button" data-tab="bells" aria-current="true">星鈴</button>
          <button type="button" data-tab="colors">糸の色</button>
          <button type="button" data-tab="memory">回想</button>
          <button type="button" data-tab="how">遊び方</button>
          <button type="button" data-tab="settings">設定</button>
        </nav>
        <div class="note-body" id="noteBody"></div>
      </div>
    </section>
  </main>
  <footer class="arcade-link"><a href="/">Game Arcade</a></footer>
  <script type="module" src="game.js"></script>
</body>
</html>
