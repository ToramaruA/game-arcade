<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>風の庭と迷子の雲</title>
  <meta name="description" content="雲海に浮かぶ小さな庭を歩き、風向きを変えて橋と綿毛を動かし、迷子の雲を45個集める箱庭パズル。草原・砂漠・空の3つの島に5つずつ庭があり、着せ替えもできる。">
  <link rel="canonical" href="https://game-arcade-bdt.pages.dev/games/wind-garden/">
  <meta property="og:type" content="website">
  <meta property="og:title" content="風の庭と迷子の雲">
  <meta property="og:description" content="雲海に浮かぶ小さな庭を歩き、風向きを変えて橋と綿毛を動かし、迷子の雲を45個集める箱庭パズル。草原・砂漠・空の3つの島に5つずつ庭があり、着せ替えもできる。">
  <meta property="og:url" content="https://game-arcade-bdt.pages.dev/games/wind-garden/">
  <meta property="og:image" content="https://game-arcade-bdt.pages.dev/games/wind-garden/og.png">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="game" class="game">
    <h1 class="sr">風の庭と迷子の雲</h1>
    <header class="hud">
      <div class="hud-row">
        <div id="gname" class="pill name">朝露の丘 <b>0/3</b></div>
        <div class="grow"></div>
        <div id="total" class="pill total" title="見つけた雲">☁ <b>0/45</b></div>
        <button id="dexBtn" class="pill btn" type="button" aria-label="図鑑を開く">図鑑</button>
        <button id="wardBtn" class="pill btn" type="button" aria-label="着せ替えを開く">👒<span class="wb-new" id="wardNew" hidden></span></button>
        <button id="muteBtn" class="pill btn icon" type="button" aria-label="音を切り替える" aria-pressed="false">♪</button>
      </div>
      <nav id="tabs" class="tabs" aria-label="庭の選択"></nav>
    </header>
    <section class="stage" id="stage">
      <canvas id="cv" aria-label="浮島の庭。矢印キーかボタンで歩き、風見鶏のそばで風を回す"></canvas>
      <div id="compass" class="compass" aria-live="polite"><span id="compassArrow">↑</span><small id="compassName">北風</small></div>
      <div id="toast" class="toast" role="status"></div>
      <div id="hintbar" class="hintbar">矢印キー／WASD か方向パッドで歩こう（ななめに進みます）</div>
    </section>
    <section class="controls" id="controls">
      <div class="dpad" id="dpad" role="group" aria-label="方向パッド">
        <button type="button" data-dir="3" class="d d-w" aria-label="西へ">↖</button>
        <button type="button" data-dir="0" class="d d-n" aria-label="北へ">↗</button>
        <button type="button" data-dir="2" class="d d-s" aria-label="南へ">↙</button>
        <button type="button" data-dir="1" class="d d-e" aria-label="東へ">↘</button>
      </div>
      <div class="actions">
        <button id="windBtn" class="windbtn" type="button" disabled>
          <span class="wb-main">風を回す</span><span class="wb-sub" id="wbSub">風見鶏のそばで</span>
        </button>
        <button id="resetBtn" class="reset" type="button">この庭をやりなおす</button>
      </div>
    </section>
    <div id="fade" class="fade" aria-hidden="true"><span>ふねで次の庭へ…</span></div>
    <section id="dex" class="modal" hidden role="dialog" aria-modal="true" aria-label="雲の図鑑">
      <div class="sheet">
        <div class="sheet-head"><h2>雲の図鑑 <b id="dexCount">0/30</b></h2><button id="dexClose" class="pill btn" type="button">とじる</button></div>
        <div id="dexBody" class="dex-body"></div>
        <div class="sheet-foot">
          <button id="cardBtn" class="pill btn primary" type="button">結果カードを作る（PNG）</button>
          <label class="vol">音量 <input id="vol" type="range" min="0" max="100" value="60" aria-label="音量"></label>
        </div>
      </div>
    </section>
    <section id="worldMap" class="modal map-modal" hidden role="dialog" aria-modal="true" aria-label="ワールドを選ぶ">
      <div class="sheet">
        <div class="sheet-head"><h2>🗺 <span id="mapMsg">どの島へ行く？</span></h2><button id="mapClose" class="pill btn" type="button">とじる</button></div>
        <p class="map-total" id="mapTotal"></p>
        <div id="worlds" class="worlds"></div>
      </div>
    </section>
    <section id="ward" class="modal" hidden role="dialog" aria-modal="true" aria-label="着せ替え">
      <div class="sheet">
        <div class="sheet-head"><h2>着せ替え</h2><button id="wardClose" class="pill btn" type="button">とじる</button></div>
        <div class="ward-top"><canvas id="wardPreview" width="160" height="160" aria-label="いまの姿"></canvas><p>雲を集めるほど、合羽と帽子が増える。<br><span id="wardMsg"></span></p></div>
        <h3 class="ward-h">合羽</h3><div id="wardCoats" class="ward-grid"></div>
        <h3 class="ward-h">帽子</h3><div id="wardHats" class="ward-grid"></div>
      </div>
    </section>
    <section id="cardModal" class="modal" hidden role="dialog" aria-modal="true" aria-label="結果カード">
      <div class="sheet">
        <div class="sheet-head"><h2>結果カード</h2><button id="cardClose" class="pill btn" type="button">とじる</button></div>
        <img id="cardImg" alt="結果カード" class="card-img">
        <div class="sheet-foot"><a id="cardDl" class="pill btn primary" download="wind-garden.png" href="#">PNGで保存</a></div>
      </div>
    </section>
  </main>
  <footer class="arcade-link"><a href="/">Game Arcade</a></footer>
  <script type="module" src="game.js"></script>
</body>
</html>
