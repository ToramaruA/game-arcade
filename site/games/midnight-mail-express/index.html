<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>終電、あの世ゆき</title>
  <meta name="description" content="行き先を間違えると、乗客の運命が変わる。走る幽霊列車で、切符を見抜き、線路を切り替え、奇妙な客を送り届けるリアルタイム車掌ゲーム。">
  <link rel="canonical" href="https://game-arcade-bdt.pages.dev/games/midnight-mail-express/">
  <meta property="og:type" content="website">
  <meta property="og:title" content="終電、あの世ゆき">
  <meta property="og:description" content="行き先を間違えると、乗客の運命が変わる。走る幽霊列車で、切符を見抜き、線路を切り替え、奇妙な客を送り届けるリアルタイム車掌ゲーム。">
  <meta property="og:url" content="https://game-arcade-bdt.pages.dev/games/midnight-mail-express/">
  <meta property="og:image" content="https://game-arcade-bdt.pages.dev/games/midnight-mail-express/og.png">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="game" class="game">
    <div id="stage">
      <canvas id="cv" aria-label="夜の線路を走る幽霊列車"></canvas>
      <div id="hud" hidden>
        <div class="hud-l"><span id="hudLine">薄明線 1/5</span><span id="hudStars" class="stars">★ 0</span></div>
        <div class="hud-c"><span id="count">00:00</span><i id="winbar"><b></b></i></div>
        <div class="hud-r"><span class="regret-l">未練</span><span id="lanterns"></span>
          <button id="btnPause" type="button" aria-label="ポーズ">Ⅱ</button></div>
      </div>
      <button id="btnSound" type="button" class="snd" aria-label="音のオン・オフ">♪</button>
      <div id="titleCard"><h1>終電、あの世ゆき</h1><p>切符を見る → 線路を選ぶ → 降ろす</p></div>
      <div id="toast" aria-live="polite"></div>
    </div>

    <section id="panel">
      <div id="menu">
        <nav id="lineTabs" aria-label="路線"></nav>
        <div id="runGrid"></div>
        <div class="menu-foot"><button id="btnAlbum" type="button" class="ghost">別れのアルバム <b id="albumCount">0/12</b></button></div>
      </div>
      <div id="controls" hidden>
        <div id="tickets"></div>
        <div id="detail"></div>
        <div id="lever">
          <button id="brL" type="button" class="branch" data-side="0"></button>
          <div class="brass" aria-hidden="true"><i id="knob"></i></div>
          <button id="brR" type="button" class="branch" data-side="1"></button>
        </div>
        <button id="btnDrop" type="button">この駅で降ろす</button>
      </div>
    </section>

    <div id="ovTutorial" class="overlay" hidden><div class="card">
      <h2>車掌のしごと</h2>
      <ol><li><b>切符</b>をタップして、客の行き先を読む</li><li>駅に着く前に、<b>分岐</b>の左右をタップして線路を選ぶ</li><li>駅に着いたら <b>「降ろす」</b>（切符を選んでから）</li></ol>
      <p class="sub">列車は止まりません。正しい駅で降ろすほど未練が減ります。（PC：1〜3 切符／←→ 分岐／Space 降ろす／P ポーズ）</p>
      <button id="btnStart" type="button" class="primary">発車！</button>
    </div></div>
    <div id="ovPause" class="overlay" hidden><div class="card">
      <h2>ポーズ中</h2><button id="btnResume" type="button" class="primary">再開</button><button id="btnQuit" type="button" class="ghost">メニューへ</button>
    </div></div>
    <div id="ovResult" class="overlay" hidden><div class="card wide"></div></div>
    <div id="ovAlbum" class="overlay" hidden><div class="card wide">
      <h2>別れのアルバム <small id="albumSub"></small></h2><div id="albumGrid"></div><button id="btnAlbumClose" type="button" class="primary">閉じる</button>
    </div></div>
  </main>
  <footer class="arcade-link"><a href="/">Game Arcade</a></footer>
  <script type="module" src="game.js"></script>
</body>
</html>
