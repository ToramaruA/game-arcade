<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>砕け、ステンドグラスの獣</title>
  <meta name="description" content="狙って弾き、帰り道で仕留めろ。聖堂の巨大な硝子獣を、反射する銀球と一度きりの呼び戻しで砕く12戦。">
  <link rel="canonical" href="https://game-arcade-bdt.pages.dev/games/stained-glass-beasts/">
  <meta property="og:type" content="website">
  <meta property="og:title" content="砕け、ステンドグラスの獣">
  <meta property="og:description" content="狙って弾き、帰り道で仕留めろ。聖堂の巨大な硝子獣を、反射する銀球と一度きりの呼び戻しで砕く12戦。">
  <meta property="og:url" content="https://game-arcade-bdt.pages.dev/games/stained-glass-beasts/">
  <meta property="og:image" content="https://game-arcade-bdt.pages.dev/games/stained-glass-beasts/og.png">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <!-- 戦い画面 -->
    <section id="battle" class="screen" hidden>
      <header class="top">
        <button id="btn-menu" class="chip" type="button" aria-label="章と戦の選択へ">≡ 選択</button>
        <div class="title"><span id="lv-name">鹿1</span></div>
        <div class="hud"><span id="ammo" aria-label="残りの球"></span><span id="hearts" aria-label="心臓のひび"></span></div>
      </header>
      <aside id="side" class="side"><h2 id="side-beast"></h2><p id="side-tip"></p><div id="side-goals"></div></aside>
      <div class="og-title" aria-hidden="true"><b>砕け、<br>ステンドグラスの獣</b><span>狙って弾き、呼び戻して、帰り道で仕留めろ。</span></div>
      <div id="stage" class="stage">
        <div id="boardwrap" class="boardwrap">
          <canvas id="board" width="640" height="800" aria-label="ステンドグラスの獣と銀球の盤面"></canvas>
          <div id="toast" class="toast" role="status" aria-live="polite"></div>
          <div id="overlay" class="overlay" hidden></div>
        </div>
        <div id="aimpad" class="aimpad" aria-label="照準領域（引いて狙い、離して撃つ）"><span id="aimhint">引いて狙う → 離して撃つ</span></div>
      </div>
      <div class="controls">
        <button id="btn-recall" class="recall" type="button" disabled>呼び戻す <small>Space</small></button>
        <div class="small-btns">
          <button id="btn-pause" class="chip" type="button">一時停止</button>
          <button id="btn-retry" class="chip" type="button">やり直し</button>
          <button id="btn-speed" class="chip" type="button" aria-pressed="false">練習 ×0.65</button>
          <button id="btn-sound" class="chip" type="button" aria-pressed="false">音</button>
          <label class="vl" for="vol">音量</label><input id="vol" type="range" min="0" max="100" value="60" aria-label="音量">
        </div>
        <details class="tabs"><summary>目標・操作</summary>
          <div id="goals"></div>
          <p class="keys">マウス／指：下の余白をドラッグして引き、離して撃つ。キー：←→ で角度、Enter で発射、Space で呼び戻し、P で一時停止、R でやり直し。</p>
          <button id="btn-sample" class="chip" type="button" hidden>見本の射線を出す</button>
        </details>
      </div>
    </section>
    <!-- 選択画面 -->
    <section id="menu" class="screen">
      <div class="menu-head">
        <h1>砕け、ステンドグラスの獣</h1>
        <p class="lead">狙って弾き、帰り道で仕留めろ。聖堂の巨大な硝子獣を、反射する銀球と一度きりの呼び戻しで砕く12戦。</p>
        <div class="menu-actions">
          <button id="btn-continue" class="primary" type="button">はじめる</button>
          <button id="btn-memorials" class="chip" type="button">記念窓</button>
          <span id="stars" class="stars"></span>
        </div>
      </div>
      <div id="chapters" class="chapters"></div>
      <footer class="arcade-link"><a href="/">Game Arcade</a></footer>
    </section>
    <!-- 記念窓 -->
    <section id="memorials" class="screen" hidden>
      <div class="menu-head">
        <button id="mem-back" class="chip" type="button">← 選択へ</button>
        <h2>記念窓</h2>
        <p class="lead">最後の1射で割った部位から作る窓。3枚までピン留めできます。</p>
      </div>
      <div id="mem-list" class="mem-list"></div>
    </section>
    <div id="memview" class="memview" hidden>
      <div class="memcard">
        <canvas id="memcanvas" width="480" height="600"></canvas>
        <div class="memside">
          <textarea id="memtext" readonly rows="4" aria-label="共有文"></textarea>
          <div class="row">
            <button id="mem-pin" class="chip" type="button">ピン留め</button>
            <button id="mem-png" class="chip" type="button">PNG保存</button>
            <button id="mem-copy" class="chip" type="button">文章コピー</button>
            <button id="mem-close" class="chip" type="button">閉じる</button>
          </div>
          <p id="mem-msg" class="msg" role="status"></p>
        </div>
      </div>
    </div>
  </div>
  <script type="module" src="game.js"></script>
</body>
</html>
