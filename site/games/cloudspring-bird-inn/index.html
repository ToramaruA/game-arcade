<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>雲海温泉と渡り鳥の宿</title>
  <meta name="description" content="お湯を分け、風を読み、渡り鳥をもてなそう。雲海に浮かぶ温泉宿の経営ゲーム。">
  <link rel="canonical" href="https://game-arcade-bdt.pages.dev/games/cloudspring-bird-inn/">
  <meta property="og:type" content="website">
  <meta property="og:title" content="雲海温泉と渡り鳥の宿">
  <meta property="og:description" content="お湯を分け、風を読み、渡り鳥をもてなそう。雲海に浮かぶ温泉宿の経営ゲーム。">
  <meta property="og:url" content="https://game-arcade-bdt.pages.dev/games/cloudspring-bird-inn/">
  <meta property="og:image" content="https://game-arcade-bdt.pages.dev/games/cloudspring-bird-inn/og.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#f8d9dc">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- タイトル -->
  <section id="title" class="title">
    <img class="title-art" src="art/title-cloudspring.webp" alt="" width="1600" height="900">
    <div class="title-card">
      <p class="title-sub">雲海に浮かぶ、渡り鳥の湯宿</p>
      <h1>雲海温泉と<br>渡り鳥の宿</h1>
      <p class="title-lead">お湯を分け、風を読み、<br>渡り鳥をもてなそう。</p>
      <p class="title-feat">春夏秋冬の28日・12種の渡り鳥・図鑑36話</p>
      <div class="title-main" id="titleMain"></div>
      <div class="day-grid" id="dayGrid" hidden></div>
    </div>
    <img class="title-koko" src="art/char-koko-welcome.webp" alt="宿主のココ" width="512" height="479">
  </section>

  <!-- ゲーム -->
  <main id="game" class="game" hidden>
    <header class="hud">
      <div class="hud-left">
        <div class="day-name" id="dayName">第1日</div>
        <div class="stats">
          <span class="stat" title="お金">💰<b id="money">60</b></span>
          <span class="stat heat" title="源泉のお湯（使っている量／全体）">♨<b id="heat">4/6</b><span class="pips" id="heatPips"></span></span>
          <span class="stat" title="満足して帰った客">🪶満足<b id="good">0</b>羽（目標<span id="need">4</span>）</span>
        </div>
      </div>
      <div class="hud-right">
        <div class="wind" id="wind" title="風"></div>
        <div class="next" id="next"></div>
      </div>
    </header>
    <div class="timecap"><span>営業時間</span><span>印＝客の到着　<i class="wkey"></i>＝風が変わる</span></div>
    <div class="timebar" id="timebar"><div class="timefill" id="timefill"></div><div class="timemarks" id="timemarks"></div></div>

    <div class="stage-wrap">
      <canvas id="board" tabindex="0" aria-label="温泉宿の盤面。矢印キーでマスを選び Enter で決定"></canvas>
      <div class="guide" id="guide" hidden>
        <img src="art/char-koko-welcome.webp" alt="" width="512" height="479">
        <p id="guideText"></p>
        <div class="guide-btns" id="guideBtns"></div>
      </div>
      <div class="toast" id="toast" hidden></div>
      <div class="banner" id="banner" hidden></div>
    </div>

    <div class="controls">
      <button type="button" id="btnPlay" class="primary">▶ 開店する</button>
      <button type="button" id="btnSpeed" class="ghost">1倍</button>
      <button type="button" id="btnHint" class="ghost">ヒント</button>
      <button type="button" id="btnReset" class="ghost">やり直す</button>
      <button type="button" id="btnMenu" class="ghost" aria-label="設定とメニュー">≡</button>
    </div>

    <aside class="side">
      <section class="panel" id="panel" aria-live="polite"></section>
      <section class="guests" id="guests"></section>
    </aside>
  </main>

  <!-- 結果 -->
  <dialog id="result" class="result">
    <div class="result-head">
      <img src="art/char-koko-welcome.webp" alt="" width="512" height="479">
      <div>
        <h2 id="resTitle">精算</h2>
        <p id="resLead"></p>
      </div>
    </div>
    <ul class="res-list" id="resList"></ul>
    <div class="res-news" id="resNews"></div>
    <p class="res-money" id="resMoney"></p>
    <div class="res-btns" id="resBtns"></div>
  </dialog>

  <!-- 図鑑 -->
  <dialog id="dex" class="dex">
    <h2>渡り鳥の図鑑 <small id="dexCount"></small></h2>
    <div class="dex-list" id="dexList"></div>
    <h3>屋根飾り <small>第二話をひらいた種の数だけ増える・タップで付け替え</small></h3>
    <div class="orn-list" id="ornList"></div>
    <div class="res-btns"><button type="button" id="dexClose" class="primary">閉じる</button></div>
  </dialog>

  <!-- 記念写真 -->
  <dialog id="photo" class="photo">
    <h2 id="photoTitle">記念写真</h2>
    <p id="photoLead" class="muted"></p>
    <img id="photoImg" alt="宿の記念写真">
    <div class="res-btns"><a id="photoSave" class="ghost btnlink" download="cloudspring.png">画像を保存</a><button type="button" id="photoClose" class="primary">閉じる</button></div>
  </dialog>

  <!-- 設定 -->
  <dialog id="menu" class="menu">
    <h2>設定</h2>
    <label><input type="checkbox" id="optMute"> 音を消す</label>
    <label><input type="checkbox" id="optCalm"> 動きを減らす</label>
    <div class="res-btns">
      <button type="button" id="btnToTitle" class="ghost">タイトルへ</button>
      <button type="button" id="btnCloseMenu" class="primary">閉じる</button>
    </div>
  </dialog>

  <footer class="arcade-link"><a href="/">Game Arcade</a></footer>
  <script type="module" src="game.js"></script>
</body>
</html>
