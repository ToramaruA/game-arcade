<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>まなざしのアトリエ</title>
  <meta name="description" content="目で絵を描く。ぶれた線で描いたお題を、友だちが当てる。">
  <link rel="canonical" href="https://game-arcade-bdt.pages.dev/games/gaze-atelier/">
  <meta property="og:type" content="website">
  <meta property="og:title" content="まなざしのアトリエ">
  <meta property="og:description" content="目で絵を描く。ぶれた線で描いたお題を、友だちが当てる。">
  <meta property="og:url" content="https://game-arcade-bdt.pages.dev/games/gaze-atelier/">
  <meta property="og:image" content="https://game-arcade-bdt.pages.dev/games/gaze-atelier/og.png">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="game" class="game">
    <h1 class="sr">まなざしのアトリエ</h1>
    <canvas id="bg" aria-hidden="true"></canvas>
    <div id="stage">
      <div id="hud"><b id="hTitle"></b><span id="hInfo"></span><button id="bBack" type="button" aria-label="もどる">✕</button></div>
      <div id="frame"><canvas id="paper" aria-label="画用紙"></canvas><div id="timer"><i id="timerFill"></i></div></div>
      <p id="caption" aria-live="polite"></p>
      <div id="actions"></div>
    </div>
    <video id="cam" playsinline muted aria-hidden="true"></video>
    <section id="screen" class="screen"></section>
  </main>
  <script type="module" src="game.js"></script>
</body>
</html>
