<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>月光美術館と十二の怪盗</title>
  <meta name="description" content="閉館後の美術館に忍び込み、警備員の視線をかいくぐって夜のかけらを取り戻せ。隠れる・走る・おとりを投げる見下ろし型ステルス。">
  <link rel="canonical" href="https://game-arcade-bdt.pages.dev/games/moonlight-heist/">
  <meta property="og:type" content="website">
  <meta property="og:title" content="月光美術館と十二の怪盗">
  <meta property="og:description" content="閉館後の美術館に忍び込み、警備員の視線をかいくぐって夜のかけらを取り戻せ。隠れる・走る・おとりを投げる見下ろし型ステルス。">
  <meta property="og:url" content="https://game-arcade-bdt.pages.dev/games/moonlight-heist/">
  <meta property="og:image" content="https://game-arcade-bdt.pages.dev/games/moonlight-heist/og.png">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="game" class="game">
    <h1 class="sr">月光美術館と十二の怪盗</h1>
    <canvas id="cv" aria-label="美術館の見下ろし画面"></canvas>
    <div id="hud" hidden>
      <div class="hud-l"><b id="hChap"></b><span id="hRoom"></span></div>
      <div class="hud-r"><span>展示品 <output id="hItems">0/45</output></span><span id="hDecoy" aria-label="おとりの残り"></span><button id="bMute" type="button" aria-label="音">♪</button><button id="bPause" type="button" aria-label="ポーズ">Ⅱ</button></div>
    </div>
    <div id="gaugeBar" hidden><i id="gaugeFill"></i></div>
    <div id="collect" hidden><i id="collectFill"></i></div>
    <div id="toast" role="status" aria-live="polite"></div>
    <div id="touch" hidden>
      <div id="dpad"><i id="knob"></i></div>
      <div id="btns"><button id="bSneak" type="button">忍び足</button><button id="bDecoy" type="button">おとり</button></div>
    </div>
    <section id="screen" class="screen"></section>
  </main>
  <script type="module" src="game.js"></script>
</body>
</html>
