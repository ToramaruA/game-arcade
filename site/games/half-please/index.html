<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>半分ください</title>
  <meta name="description" content="そのケーキ、ぴったり半分に切れますか？ 一筆で切って、目分量の限界に挑む5問。">
  <link rel="canonical" href="https://game-arcade-bdt.pages.dev/games/half-please/">
  <meta property="og:type" content="website">
  <meta property="og:title" content="半分ください">
  <meta property="og:description" content="そのケーキ、ぴったり半分に切れますか？ 一筆で切って、目分量の限界に挑む5問。">
  <meta property="og:url" content="https://game-arcade-bdt.pages.dev/games/half-please/">
  <meta property="og:image" content="https://game-arcade-bdt.pages.dev/games/half-please/og.png">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="game" class="game">
    <header class="top">
      <h1>半分ください</h1>
      <p class="status"><span id="round">1 / 5</span><span id="total">合計 0</span><span id="best">ベスト -</span></p>
    </header>
    <p id="prompt" class="prompt">線を引いて、面積を半分に！</p>
    <canvas id="board" width="600" height="600" aria-label="ケーキ。ドラッグして線を引き、半分に切る"></canvas>
    <section id="result" class="result" hidden>
      <p id="ratio" class="ratio"></p>
      <p id="points" class="points"></p>
    </section>
    <button id="next" type="button" hidden>次へ</button>
  </main>
  <footer class="arcade-link"><a href="/">Game Arcade</a></footer>
  <script type="module" src="game.js"></script>
</body>
</html>
