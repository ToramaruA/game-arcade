<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ひなたの巨獣と小さな引越し屋</title>
  <meta name="description" content="乗せる重さで道が変わる。小さなヤドカリが動物を運ぶ、ひなたの巨獣の背中の引越しパズル。">
  <link rel="canonical" href="https://game-arcade-bdt.pages.dev/games/sunlit-giant-movers/">
  <meta property="og:type" content="website">
  <meta property="og:title" content="ひなたの巨獣と小さな引越し屋">
  <meta property="og:description" content="乗せる重さで道が変わる。小さなヤドカリが動物を運ぶ、ひなたの巨獣の背中の引越しパズル。">
  <meta property="og:url" content="https://game-arcade-bdt.pages.dev/games/sunlit-giant-movers/">
  <meta property="og:image" content="https://game-arcade-bdt.pages.dev/games/sunlit-giant-movers/og.png">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="game" class="game">
    <h1 class="sr">ひなたの巨獣と小さな引越し屋</h1>
    <header class="hud" id="hud">
      <div class="row">
        <button id="mapBtn" class="pill lv" type="button" aria-label="地域と面をえらぶ"><span id="lvNo">1</span><b id="lvName">くしゃみ橋</b></button>
        <div class="grow"></div>
        <button id="dexBtn" class="pill icon" type="button" aria-label="図鑑">図鑑</button>
        <button id="setBtn" class="pill icon" type="button" aria-label="設定">⚙</button>
      </div>
      <div class="row stats">
        <div class="stat" title="新居へ届けた数"><span class="ic">🏠</span><b id="delv">0/2</b></div>
        <div class="load" id="loadBox" aria-label="荷重">
          <span class="lbl">荷重</span>
          <span class="slots" id="slots"><i></i><i></i><i></i></span>
          <span class="state" id="loadState">軽い</span>
        </div>
        <div class="stat" title="種"><span class="ic seed"></span><b id="seedc">0/3</b></div>
        <div class="stat moves" title="手数"><b id="movec">0</b><small>手</small></div>
      </div>
    </header>
    <section class="stage" id="stage">
      <canvas id="cv" aria-label="巨獣の背中の箱庭。方向ボタンや矢印キーで歩き、動物にぶつかると乗せ、家や台にぶつかると降ろす"></canvas>
      <div id="coach" class="coach" aria-live="polite"></div>
      <div id="toast" class="toast" role="status"></div>
      <button id="fitBtn" class="pill fit" type="button" hidden>全体を見る</button>
      <div id="pick" class="pick" hidden role="dialog" aria-label="だれを降ろす？">
        <p>だれを降ろす？</p>
        <div id="pickBtns" class="pick-btns"></div>
      </div>
    </section>
    <section class="controls">
      <div class="dpad" id="dpad" role="group" aria-label="方向パッド">
        <button type="button" data-dir="3" class="d d-l" aria-label="左上へ">↖</button>
        <button type="button" data-dir="0" class="d d-u" aria-label="右上へ">↗</button>
        <button type="button" data-dir="2" class="d d-d" aria-label="左下へ">↙</button>
        <button type="button" data-dir="1" class="d d-r" aria-label="右下へ">↘</button>
      </div>
      <div class="acts">
        <button id="undoBtn" class="undo" type="button" aria-label="1手戻す（長押しで連続）"><span>↶</span>戻す</button>
        <div class="sub">
          <button id="hintBtn" class="small" type="button">ヒント</button>
          <button id="resetBtn" class="small" type="button">最初から</button>
        </div>
      </div>
    </section>

    <section id="title" class="title-screen" aria-label="タイトル">
      <div class="title-card">
        <p class="kicker">箱庭の引越しパズル</p>
        <h2>ひなたの巨獣と<br>小さな引越し屋</h2>
        <p class="tag">乗せる重さで、道が変わる。</p>
        <div class="title-btns">
          <button id="startBtn" class="big" type="button">はじめる</button>
          <button id="contBtn" class="mid" type="button" hidden>つづきから</button>
          <button id="selBtn" class="mid ghost" type="button">地域をえらぶ</button>
        </div>
      </div>
    </section>

    <section id="mapModal" class="modal" hidden role="dialog" aria-modal="true" aria-label="地域と面">
      <div class="sheet">
        <div class="sheet-head"><h2>引越しの地図</h2><button class="pill close" data-close type="button">とじる</button></div>
        <p class="sheet-note" id="mapNote"></p>
        <div id="regions" class="regions"></div>
      </div>
    </section>

    <section id="dexModal" class="modal" hidden role="dialog" aria-modal="true" aria-label="図鑑">
      <div class="sheet">
        <div class="sheet-head"><h2>動物図鑑 <b id="dexCount">0/12</b></h2><button class="pill close" data-close type="button">とじる</button></div>
        <div class="sheet-body">
          <div id="dexGrid" class="dex-grid"></div>
          <h3 class="sub-h">コロの甲羅模様 <b id="patCount">1/12</b> <small id="seedTotal">種 0/54</small></h3>
          <div id="patGrid" class="pat-grid"></div>
        </div>
      </div>
    </section>

    <section id="setModal" class="modal" hidden role="dialog" aria-modal="true" aria-label="設定">
      <div class="sheet narrow">
        <div class="sheet-head"><h2>設定</h2><button class="pill close" data-close type="button">とじる</button></div>
        <div class="sheet-body settings">
          <label>音量 <input id="vol" type="range" min="0" max="100" value="60"></label>
          <label class="chk"><input id="muteChk" type="checkbox"> 音を消す</label>
          <label class="chk"><input id="musicChk" type="checkbox" checked> 曲を流す</label>
          <label class="chk"><input id="shakeChk" type="checkbox" checked> 画面の揺れ</label>
          <label class="chk"><input id="calmChk" type="checkbox"> 動きを減らす</label>
          <p class="keys">PC：矢印キー/WASD で歩く・Z で戻す・R で最初から・H でヒント</p>
          <button id="wipeBtn" class="small danger" type="button">記録をすべて消す</button>
        </div>
      </div>
    </section>

    <section id="result" class="modal" hidden role="dialog" aria-modal="true" aria-label="引越し完了">
      <div class="sheet narrow result">
        <h2 id="resTitle">引越し完了！</h2>
        <canvas id="resArt" width="320" height="150" aria-hidden="true"></canvas>
        <ul class="res-stats" id="resStats"></ul>
        <p id="resNew" class="res-new"></p>
        <div class="res-btns">
          <button id="nextBtn" class="big" type="button">次の面へ</button>
          <button id="againBtn" class="mid ghost" type="button">もう一度</button>
          <button id="copyBtn" class="mid ghost" type="button">結果をコピー</button>
        </div>
      </div>
    </section>

    <section id="story" class="story" hidden aria-live="polite">
      <canvas id="storyCv"></canvas>
      <p id="storyText" class="story-text"></p>
      <button id="skipBtn" class="pill skip" type="button">とばす ▶</button>
    </section>
  </main>
  <footer class="arcade-link"><a href="/">Game Arcade</a></footer>
  <script type="module" src="game.js"></script>
</body>
</html>
