<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Game Arcade</title>
  <meta name="description" content="AIが企画・制作し、人が遊んで確かめたブラウザゲーム集。">
  <link rel="canonical" href="https://game-arcade-bdt.pages.dev/">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Game Arcade">
  <meta property="og:description" content="AIが企画・制作し、人が遊んで確かめたブラウザゲーム集。">
  <meta property="og:url" content="https://game-arcade-bdt.pages.dev/">
  <meta name="twitter:card" content="summary">
  <link rel="stylesheet" href="/assets/arcade.css">
</head>
<body>
  <main class="arcade">
    <h1>Game Arcade</h1>
    <p class="lead">AIが企画・制作し、人が遊んで確かめたブラウザゲーム。</p>
    <ul id="game-list" class="game-list" aria-live="polite">
      <!-- games:start（npm run site-index で自動生成） -->
      <li><a href="/games/abyssal-signal/"><img src="/games/abyssal-signal/og.png" alt="深海、未確認反応のゲーム画面" loading="lazy" width="1200" height="630"><strong>深海、未確認反応</strong><span>その光に、近づいていいのか。古い潜水艇で未知の巨大生物を誘い、あなただけの一枚を持ち帰る深海探査。</span></a></li>
      <li><a href="/games/last-hull/"><img src="/games/last-hull/og.png" alt="切り離せ、最後の一隻のゲーム画面" loading="lazy" width="1200" height="630"><strong>切り離せ、最後の一隻</strong><span>あと一手、待てば救える。でも、その一手で船が燃える。乗員を逃がし、船体を切り離して帰還を目指す宇宙船危機パズル。</span></a></li>
      <!-- games:end -->
    </ul>
    <p id="empty" class="empty" hidden>まだ公開中のゲームはありません。準備中です。</p>
  </main>
  <script>
    // 一覧は npm run site-index で HTML に書き込み済み（検索エンジン向け）。空のときだけ games.json から作る。
    if (!document.querySelector('#game-list li')) fetch('/games/games.json')
      .then((r) => r.json())
      .then((games) => {
        const list = document.getElementById('game-list');
        const shown = games.filter((g) => g.listed !== false);
        if (shown.length === 0) {
          document.getElementById('empty').hidden = false;
          return;
        }
        for (const g of shown) {
          const li = document.createElement('li');
          const a = document.createElement('a');
          a.href = `/games/${g.slug}/`;
          const img = document.createElement('img');
          img.src = `/games/${g.slug}/og.png`;
          img.alt = `${g.title}のゲーム画面`;
          img.loading = 'lazy';
          img.width = 1200; img.height = 630;
          a.append(img);
          const title = document.createElement('strong');
          title.textContent = g.title;
          const desc = document.createElement('span');
          desc.textContent = g.description;
          a.append(title, desc);
          li.append(a);
          list.append(li);
        }
      })
      .catch(() => {
        document.getElementById('empty').hidden = false;
      });
  </script>
</body>
</html>
