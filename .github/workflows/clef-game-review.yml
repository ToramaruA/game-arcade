name: Clef game planning review

on:
  issues:
    types: [opened, edited]

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: clef-planning-daily-budget
  cancel-in-progress: false

jobs:
  review:
    if: >-
      github.repository == 'ToramaruA/game-arcade' &&
      github.event.issue.user.login == 'ToramaruA' &&
      startsWith(github.event.issue.title, '[CLEF-REVIEW] ') &&
      github.event.issue.state == 'open'
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Judge game ideas or detailed design (never creates GAME issues)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/clef-game-judge-issue.mjs
